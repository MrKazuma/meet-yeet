<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet & Yeet</title>
<link rel="icon" type="image/png" href="/icons/logo.png">
<link rel="stylesheet" href="/styles.css">

<script>
const user = localStorage.getItem("user");
if(!user){
  window.location.href="/login";
}
</script>

<style>

body{
overflow:hidden;
background: var(--bg);
}

/* HEADER */

#header{
position:absolute;
top:14px;
left:14px;
font-size:15px;
z-index: 5;
padding: 8px 14px;
border-radius: var(--radius-pill);
background: rgba(10, 10, 18, 0.55);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
}

#header img{
height:24px;
}

/* ACCOUNT ICON */

#accountIcon{
position:absolute;
top:10px;
/* Stay clear of the chat panel (320px wide, docked top-right) so this
   doesn't sit on top of its "Meeting Chat" header. */
right: calc(320px + 14px);
z-index: 15;
width:44px;
height:44px;
padding:0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background: var(--surface-alt);
border: 1px solid var(--border);
transition: border-color var(--transition-fast), background-color var(--transition-fast);
}

#accountIcon:hover{
border-color: var(--border-strong);
background: var(--surface);
}

#accountIcon img{
border-radius:50%;
width:22px;
height:22px;
}

/* ACCOUNT PANEL */

#accountPanel{
position:absolute;
top:60px;
right: calc(320px + 14px);
width:230px;
padding:16px;
display:none;
z-index:10;
border-radius: var(--radius-md);
background: rgba(18, 18, 30, 0.9);
border: 1px solid var(--glass-border);
backdrop-filter: blur(18px);
-webkit-backdrop-filter: blur(18px);
box-shadow: var(--shadow-lg);
}

#accountPanel h3{
margin:0 0 10px;
font-size:14px;
font-weight:700;
color: var(--text-muted);
text-transform:uppercase;
letter-spacing:0.03em;
}

#userName{
margin:0 0 10px;
font-weight:600;
font-size:15px;
}

#accountPanel input{
width:100%;
box-sizing:border-box;
padding:9px 10px;
margin-bottom:10px;
border:1px solid var(--border);
border-radius:var(--radius-sm);
background:var(--surface-alt);
color:var(--text);
font:inherit;
font-size:13px;
}

#accountPanel input:focus-visible{
outline:none;
border-color:var(--brand);
box-shadow:0 0 0 3px var(--brand-soft);
}

#accountPanel button{
width:100%;
padding:9px;
margin-top:6px;
border:none;
border-radius:var(--radius-sm);
color:white;
font:inherit;
font-size:13px;
font-weight:600;
cursor:pointer;
transition: background-color var(--transition-fast);
min-height: 38px;
}

#accountPanel button:first-of-type{
background:var(--brand);
}
#accountPanel button:first-of-type:hover{
background:var(--brand-hover);
}

#accountPanel button:last-of-type{
background:var(--surface-alt);
border:1px solid var(--border);
color:var(--text);
}
#accountPanel button:last-of-type:hover{
background:var(--border);
}

/* VIDEO AREA */

#videoStage{
position:absolute;
top:0;
left:0;
right:320px;
bottom:120px;
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:10px;
padding:10px;
overflow-y:auto;
}

#videoContainer{
min-width:300px;
min-height:200px;
max-height:100%;
flex: 1 1 300px;
position:relative;
display:flex;
justify-content:center;
align-items:center;
background: #050508;
border:1px solid var(--border);
border-radius:var(--radius-lg);
overflow:hidden;
}

.remoteVideoContainer {
min-width:300px;
min-height:200px;
max-height:100%;
flex: 1 1 300px;
position:relative;
display:flex;
justify-content:center;
align-items:center;
background: #050508;
border:1px solid var(--border);
border-radius:var(--radius-lg);
overflow:hidden;
}

.remoteVideoContainer video {
width:100%;
height:100%;
object-fit:cover;
}

#videoContainer.sharing, .remoteVideoContainer.sharing {
max-height: 100% !important;
flex: 1 1 100% !important;
}

video{
position:relative;
z-index:1;
width:100%;
height:100%;
object-fit:cover;
}

/* Mirror only the local self-view (like every other video-call app) so it
   feels like a mirror to look at; remote participants still see you the
   right way round, since this is purely a display transform. Screen shares
   should never be mirrored. */
#localVideo{
transform: scaleX(-1);
}

#localVideo.no-mirror{
transform: none;
}

/* CONTROL BAR */

#controls{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:10px 20px;
border-radius:var(--radius-pill);
display:flex;
align-items:center;
gap:16px;
box-shadow: var(--shadow-lg);
z-index: 9999;
}

.controlBtn{
background: var(--surface-alt);
border:1px solid var(--border);
border-radius:50%;
width:56px;
height:56px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color: var(--text);
transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}

.controlBtn:hover{
background: var(--brand);
border-color: var(--brand);
color:#1A0F00;
}

.controlBtn svg{
width:22px;
height:22px;
}

/* TOOLTIPS */
[data-tooltip] {
  position: relative;
}

[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 110%; /* Place directly above the button */
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
  pointer-events: none;
  z-index: 100;
}

[data-tooltip]:hover::after,
[data-tooltip]:focus-visible::after {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

#endMeetingBtn {
background-color: var(--danger);
border: none;
border-radius: var(--radius-pill);
color: #1A0303;
padding: 0 24px;
font-weight: 700;
cursor: pointer;
transition: background-color var(--transition-fast);
height: 56px;
font-size: 15px;
display: flex;
align-items: center;
justify-content: center;
}

#endMeetingBtn:hover {
background-color: var(--danger-hover);
}

/* BACKGROUND DROPDOWN */

.cam-options {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  padding: 10px;
  display: none;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  width: 232px;
  z-index: 9999;
}

.cam-options.show {
  display: flex !important;
}

.cam-options-label{
  padding: 2px 2px 6px;
  font-size: 11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color: var(--text-faint);
}

.bg-swatch-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.bg-swatch{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  padding: 4px 2px 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
  color: var(--text-muted);
  transition: background-color var(--transition-fast), color var(--transition-fast);
}

.bg-swatch:hover{
  background: var(--surface-alt);
  color: var(--text);
}

.bg-swatch-preview{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.bg-swatch-none{
  background: var(--surface-alt);
  color: var(--text-muted);
}

.bg-swatch-blur{
  background: linear-gradient(135deg, #6B7280, #1F2937);
  backdrop-filter: blur(2px);
}

.bg-swatch-upload{
  background: var(--surface-alt);
  border-style: dashed;
  color: var(--text-muted);
}

.bg-swatch:hover .bg-swatch-upload{
  color: var(--brand);
  border-color: var(--brand);
}

.bg-swatch-label{
  font-size: 11px;
  font-weight: 600;
}

.bg-swatch.active .bg-swatch-preview{
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}

.bg-swatch.active{
  color: var(--text);
}

.split-btn {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
}
.split-btn-main {
  background: transparent;
  border: none;
  border-radius: var(--radius-pill) 0 0 var(--radius-pill);
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text);
  transition: background-color var(--transition-fast), color var(--transition-fast);
}
.split-btn-main:hover, .split-btn-drop:hover {
  background: var(--brand);
  color: #1A0F00;
}
.split-btn-main svg {
  width: 22px;
  height: 22px;
}
.split-btn-drop {
  background: transparent;
  border: none;
  border-left: 1px solid var(--border);
  border-radius: 0 var(--radius-pill) var(--radius-pill) 0;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: background-color var(--transition-fast), color var(--transition-fast);
}

@media (max-width: 850px) {
  .split-btn-main {
    width: 45px;
    height: 45px;
  }
  .split-btn-main svg {
    width: 20px;
    height: 20px;
  }
}

/* CHAT PANEL */

#chatPanel{
position:absolute;
top:0;
right:0;
width:320px;
bottom:0;
background: var(--bg-elevated);
display:flex;
flex-direction:column;
border-left:1px solid var(--border);
}

#chatHeader{
padding:16px;
font-weight:700;
font-size: 15px;
border-bottom:1px solid var(--border);
color: var(--text);
}

#participantsSection{
padding:12px 16px;
border-bottom:1px solid var(--border);
}

#participantsTitle{
font-size:13px;
font-weight:700;
color: var(--text-muted);
text-transform:uppercase;
letter-spacing:0.03em;
margin-bottom:8px;
}

#participantsCount{
color:var(--text-faint);
font-weight:600;
margin-left:4px;
text-transform:none;
letter-spacing:0;
}

#participantsList{
margin:0;
padding:0;
list-style:none;
max-height:110px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:6px;
}

#participantsList li{
color:var(--text);
font-size:14px;
padding: 4px 0;
}

#chatBox{
flex:1;
overflow-y:auto;
padding:14px 16px;
display:flex;
flex-direction:column;
gap:8px;
font-size: 14px;
line-height: 1.5;
}

#chatBox strong{
color: var(--brand);
margin-right:4px;
}

#chatInputArea{
display:flex;
gap:8px;
padding:14px;
border-top:1px solid var(--border);
}

#chatInput{
flex:1;
padding:10px 12px;
border-radius:var(--radius-md);
border:1px solid var(--border);
outline:none;
background:var(--surface-alt);
color:var(--text);
font: inherit;
font-size: 14px;
transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

#chatInput:focus-visible{
border-color: var(--brand);
box-shadow: 0 0 0 3px var(--brand-soft);
}

#sendBtn{
background: var(--brand);
border:none;
color:#1A0F00;
padding:0 16px;
border-radius:var(--radius-md);
cursor:pointer;
font-weight:700;
font-size: 14px;
min-height: 40px;
transition: background-color var(--transition-fast);
}

#sendBtn:hover{
background: var(--brand-hover);
}

/* RESPONSIVE LAYOUT */
@media (max-width: 850px) {
  #videoStage {
    right: 0;
    bottom: 150px;
    padding: 5px;
  }

  #videoContainer, .remoteVideoContainer {
    flex: 1 1 150px;
    height: auto;
    max-height: 100%;
    min-width: 150px;
    min-height: 150px;
  }

  #chatPanel {
    position: fixed;
    top: auto;
    bottom: -100%; /* hide it by default */
    right: 0;
    left: 0;
    width: 100%;
    height: 60vh;
    border-left: none;
    border-top: 1px solid var(--border);
    border-top-left-radius: var(--radius-lg);
    border-top-right-radius: var(--radius-lg);
    transition: bottom 0.3s ease-in-out;
    z-index: 50;
    box-shadow: var(--shadow-lg);
  }

  #chatPanel.active {
    bottom: 0;
  }

  /* Close Chat Button wrapper */
  #chatOpenerWrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #closeChatBtnMobile {
    display: flex !important;
    align-items:center;
    justify-content:center;
    width: 36px;
    height: 36px;
    margin-right: 8px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
  }

  #controls {
    width: 92%;
    gap: 8px;
    padding: 10px;
    box-sizing: border-box;
    justify-content: space-around;
    bottom: 10px;
  }

  .controlBtn {
    width: 45px;
    height: 45px;
  }

  .controlBtn svg {
    width: 20px;
    height: 20px;
  }

  #endMeetingBtn {
    height: 45px;
    padding: 0 15px;
    font-size: 14px;
  }

  #chatToggleBtnMobile {
    display: flex !important;
  }

  #header {
    font-size: 15px;
    left: 12px;
  }
  #header img {
    height: 22px;
  }
  #accountIcon {
    right: 12px;
  }
  #accountPanel {
    right: 12px;
  }
}

</style>
</head>

<body>

<div id="header" class="brand-mark">
<img src="/icons/logo.png" alt="Meet & Yeet logo">
Meet &amp; Yeet
</div>

<button id="accountIcon" class="clickable" onclick="toggleAccount()" aria-label="Account menu">
<img src="/icons/logo.png" alt="">
</button>

<div id="accountPanel">
<h3>My account</h3>
<p id="userName"></p>
<input id="nameInput" placeholder="Enter your name">
<button onclick="saveName()">Save</button>
<button onclick="logout()">Logout</button>
</div>

<div id="videoStage">
<div id="videoContainer">
<video id="localVideo" autoplay muted playsinline></video>
</div>
</div>

<div id="controls" class="glass">

<div class="split-btn">
<button id="videoBtn" class="split-btn-main" data-tooltip="Toggle camera" aria-label="Toggle camera" onclick="toggleVideo()">
  <span id="camIcon" style="display:flex; align-items:center; justify-content:center;">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
  </span>
</button>
<button id="camOptionsBtn" class="split-btn-drop" data-tooltip="Camera options" aria-label="Camera options" onclick="toggleCameraOptions(event)">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
<div id="camOptions" class="cam-options" style="bottom: calc(100% + 15px); left: 50%; transform: translateX(-50%);">
  <div class="cam-options-label">Background</div>
  <div class="bg-swatch-grid" id="bgSwatchGrid">
    <button class="bg-swatch active" data-bg="none" onclick="changeBackground('none')" aria-label="No background effect">
      <span class="bg-swatch-preview bg-swatch-none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="20" y2="20"></line><circle cx="12" cy="12" r="9"></circle></svg>
      </span>
      <span class="bg-swatch-label">None</span>
    </button>
    <button class="bg-swatch" data-bg="blur" onclick="changeBackground('blur')" aria-label="Blur background">
      <span class="bg-swatch-preview bg-swatch-blur"></span>
      <span class="bg-swatch-label">Blur</span>
    </button>
    <button class="bg-swatch" data-bg="studio" onclick="changeBackground('studio')" aria-label="Studio virtual background">
      <span class="bg-swatch-preview" style="background:linear-gradient(135deg,#3A3A46,#101015)"></span>
      <span class="bg-swatch-label">Studio</span>
    </button>
    <button class="bg-swatch" data-bg="ocean" onclick="changeBackground('ocean')" aria-label="Ocean virtual background">
      <span class="bg-swatch-preview" style="background:linear-gradient(135deg,#38BDF8,#0C4A6E)"></span>
      <span class="bg-swatch-label">Ocean</span>
    </button>
    <button class="bg-swatch" data-bg="sunset" onclick="changeBackground('sunset')" aria-label="Sunset virtual background">
      <span class="bg-swatch-preview" style="background:linear-gradient(135deg,#FB923C,#7C3AED)"></span>
      <span class="bg-swatch-label">Sunset</span>
    </button>
    <button class="bg-swatch" data-bg="forest" onclick="changeBackground('forest')" aria-label="Forest virtual background">
      <span class="bg-swatch-preview" style="background:linear-gradient(135deg,#4ADE80,#064E3B)"></span>
      <span class="bg-swatch-label">Forest</span>
    </button>
    <button class="bg-swatch" id="customBgUploadBtn" onclick="triggerCustomBackgroundUpload()" aria-label="Upload a custom background image">
      <span class="bg-swatch-preview bg-swatch-upload">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
      </span>
      <span class="bg-swatch-label">Upload</span>
    </button>
  </div>
  <input type="file" id="customBgInput" accept="image/*" style="display:none">
</div>
</div>

<button id="micBtn" class="controlBtn" data-tooltip="Toggle microphone" aria-label="Toggle microphone">
  <span id="micIcon" style="display:flex; align-items:center; justify-content:center;">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
  </span>
</button>

<button id="screenBtn" class="controlBtn" data-tooltip="Share screen" aria-label="Share screen">
  <span id="screenIcon" style="display:flex; align-items:center; justify-content:center;">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
  </span>
</button>

<button id="chatToggleBtnMobile" class="controlBtn" style="display: none;" onclick="toggleMobileChat()" data-tooltip="Open chat" aria-label="Open chat">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
</button>

<button id="endMeetingBtn" data-tooltip="Leave call" aria-label="Leave call">
End Meeting
</button>

</div>



<div id="chatPanel">

<div id="chatOpenerWrapper" style="border-bottom:1px solid var(--border);">
  <div id="chatHeader" style="border-bottom:none;">Meeting Chat</div>
  <button id="closeChatBtnMobile" style="display: none;" onclick="toggleMobileChat()" aria-label="Close chat">&#10005;</button>
</div>

<div id="participantsSection">
<div id="participantsTitle">Participants <span id="participantsCount">(0)</span></div>
<ul id="participantsList"></ul>
</div>

<div id="chatBox"></div>

<div id="chatInputArea">
<input id="chatInput" type="text" placeholder="Type message..." aria-label="Chat message">
<button id="sendBtn">Send</button>
</div>

</div>

<script>
(function () {
    // Load the Socket.IO client straight from the backend that actually runs
    // it (same version guaranteed) instead of the cdn.socket.io CDN - some
    // ISPs/networks silently block that CDN's IPs, which otherwise stalls
    // this whole page since it's a render-blocking script.
    var host = window.location.hostname;
    var socketBase = (host === "localhost" || host === "127.0.0.1")
        ? ""
        : "https://meet-yeet-1.onrender.com";
    document.write('<script src="' + socketBase + '/socket.io/socket.io.js"><\/script>');
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script src="/script.js"></script>

<script>

const loggedUser = JSON.parse(localStorage.getItem("user"));

if(loggedUser){
document.getElementById("userName").innerText = loggedUser.name || loggedUser.email;
}

function logout(){
localStorage.removeItem("user");
window.location.href="/login";
}

function toggleMobileChat() {
  const panel = document.getElementById("chatPanel");
  panel.classList.toggle("active");
}

</script>

</body>
</html>
