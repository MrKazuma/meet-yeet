<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Meeting - Meet & Yeet</title>
<link rel="icon" type="image/png" href="/icons/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
body{
margin:0;
padding:48px 16px;
display:flex;
justify-content:center;
background:
  radial-gradient(55% 45% at 85% 0%, rgba(255,122,0,0.12), transparent 60%),
  var(--bg);
}

#card{
width:100%;
max-width:520px;
padding:28px;
}

.card-header{
display:flex;
align-items:center;
gap:14px;
margin-bottom:24px;
}

.card-header img{
height:36px;
}

h2{
margin:0;
font-size:20px;
letter-spacing:-0.01em;
}

.actions{
display:flex;
gap:10px;
margin-top:4px;
}

#result{
margin-top:16px;
color:var(--text-muted);
font-size:14px;
min-height: 20px;
}

#result a{
color:var(--accent);
}

h3{
margin:32px 0 12px;
font-size:15px;
font-weight:700;
color:var(--text);
}

#allMeetings{
margin:0;
padding:0;
list-style:none;
display:flex;
flex-direction:column;
gap:10px;
}

#allMeetings li{
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:8px;
padding:12px 14px;
background:var(--surface-alt);
border:1px solid var(--border);
border-radius:var(--radius-md);
font-size:14px;
color:var(--text-muted);
}

#allMeetings li a{
color:var(--accent);
font-weight:600;
text-decoration:none;
}

#allMeetings li a:hover{
text-decoration:underline;
}

.smallBtn{
padding:7px 12px;
font-size:12px;
font-weight:600;
min-height:32px;
}
</style>
</head>

<body>

<div id="card" class="card">

<div class="card-header">
  <img src="/icons/logo.png" alt="Meet & Yeet logo">
  <h2>Schedule meeting</h2>
</div>

<div class="field">
  <label for="title">Meeting title</label>
  <input id="title" class="input" placeholder="Weekly sync">
</div>

<div class="field">
  <label for="time">Date &amp; time</label>
  <input id="time" class="input" type="datetime-local">
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="schedule()">Schedule</button>
  <button class="btn btn-ghost" onclick="window.location='/'">Back to home</button>
</div>

<p id="result"></p>

<h3>All scheduled meetings</h3>
<ul id="allMeetings">
<li>Loading...</li>
</ul>

</div>

<script>
const API_URL = (() => {
const host = window.location.hostname;
if(host === "localhost" || host === "127.0.0.1"){
return "";
}
return "/api";
})();


async function schedule(){

const title=document.getElementById("title").value;
const time=document.getElementById("time").value;

const res=await fetch(`${API_URL}/schedule-meeting`,{
method:"POST",
credentials:"include",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({title,time})
});

const data=await res.json();

if(!res.ok || !data.success){
document.getElementById("result").innerText=data.message || "Could not schedule meeting";
return;
}

document.getElementById("result").innerHTML=
"Meeting link: <a href='"+data.link+"'>"+data.link+"</a> " +
"<button class='btn btn-ghost smallBtn' onclick='startNow(\""+data.meetingId+"\")'>Start now</button>";

document.getElementById("title").value="";
document.getElementById("time").value="";

loadAllMeetings();

}

async function loadAllMeetings(){

const list=document.getElementById("allMeetings");

try{
const res=await fetch(`${API_URL}/scheduled-meetings`, { credentials:"include" });
const data=await res.json();

if(!data.success || !data.meetings.length){
list.innerHTML="<li>No scheduled meetings yet.</li>";
return;
}

list.innerHTML="";

data.meetings.forEach(meeting=>{
const li=document.createElement("li");
const when=new Date(meeting.time).toLocaleString();
li.innerHTML=`<span>${meeting.title} &middot; ${when}</span><span><a href="${meeting.link}">Join</a> <button class="btn btn-ghost smallBtn" onclick="startNow('${meeting.meetingId}')">Start now</button></span>`;
list.appendChild(li);
});

}catch(error){
list.innerHTML="<li>Unable to load meetings.</li>";
}

}

async function startNow(meetingId){

try{
const res = await fetch(`${API_URL}/start-meeting/${meetingId}`,{
method:"POST",
credentials:"include"
});

const data = await res.json();

if(!res.ok || !data.success){
document.getElementById("result").innerText=data.message || "Could not start meeting";
return;
}

window.location = data.link;
}catch(error){
document.getElementById("result").innerText="Could not start meeting";
}

}

loadAllMeetings();

</script>

</body>

</html>
