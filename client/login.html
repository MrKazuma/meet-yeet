<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Meet & Yeet</title>
<link rel="icon" type="image/png" href="/icons/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding: 24px 16px;
background:
  radial-gradient(60% 50% at 15% 10%, rgba(255,122,0,0.12), transparent 60%),
  radial-gradient(50% 40% at 85% 90%, rgba(47,155,255,0.10), transparent 60%),
  var(--bg);
}

.page{
display:flex;
flex-direction:column;
align-items:center;
gap:28px;
width:100%;
max-width:380px;
}

.logo-lockup{
font-size:26px;
}

.logo-lockup img{
height:38px;
}

.box{
width:100%;
padding:32px;
}

h2{
margin:0 0 4px;
font-size:22px;
letter-spacing:-0.01em;
}

.subtitle{
margin:0 0 24px;
color:var(--text-muted);
font-size:14px;
}

#signupSection{
display:none;
}

.toggle{
font-size:14px;
text-align:center;
margin-top:18px;
color:var(--text-muted);
}

#msg{
min-height:20px;
color:var(--danger-hover);
text-align:center;
font-size:13px;
margin:14px 0 0;
}
</style>
</head>

<body>

<div class="page">
  <div class="brand-mark logo-lockup">
    <img src="/icons/logo.png" alt="Meet & Yeet logo">
    Meet &amp; Yeet
  </div>

  <div class="box card">

    <div id="loginSection">
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to start or join a meeting.</p>

      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" class="input" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" class="input" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full" onclick="login()">Log in</button>
      <div class="toggle">Don't have an account? <span class="btn-link clickable" onclick="toggleView('signup')">Sign up</span></div>
    </div>

    <div id="signupSection">
      <h2>Create your account</h2>
      <p class="subtitle">It only takes a moment.</p>

      <div class="field">
        <label for="signupName">Name</label>
        <input id="signupName" class="input" placeholder="Jane Doe" autocomplete="name">
      </div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input id="signupEmail" class="input" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input id="signupPassword" class="input" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
      </div>

      <button class="btn btn-primary btn-full" onclick="signup()">Sign up</button>
      <div class="toggle">Already have an account? <span class="btn-link clickable" onclick="toggleView('login')">Log in</span></div>
    </div>

    <p id="msg"></p>

  </div>
</div>

<script>
const API_URL = (() => {
const host = window.location.hostname;
if(host === "localhost" || host === "127.0.0.1"){
return "";
}
return "/api";
})();


function getNextPath(){
const params = new URLSearchParams(window.location.search);
const next = params.get("next");

if(!next || !next.startsWith("/")){
return "/";
}

return next;
}

document.getElementById("loginPassword").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});

document.getElementById("loginEmail").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});

document.getElementById("signupPassword").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        signup();
    }
});

document.getElementById("signupEmail").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        signup();
    }
});

document.getElementById("signupName").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        signup();
    }
});

function toggleView(view) {
document.getElementById("msg").innerText = "";
if(view === 'signup') {
document.getElementById("loginSection").style.display = "none";
document.getElementById("signupSection").style.display = "block";
} else {
document.getElementById("loginSection").style.display = "block";
document.getElementById("signupSection").style.display = "none";
}
}

async function login(){

const email = document.getElementById("loginEmail").value;
const password = document.getElementById("loginPassword").value;

try{
const res = await fetch(`${API_URL}/login`,{
method:"POST",
credentials:"include",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
});

const data = await res.json();

if(data.success){
localStorage.setItem("user",JSON.stringify(data.user));
window.location.href=getNextPath();
}else{
document.getElementById("msg").innerText=data.message || "Login failed";
}
}catch(error){
document.getElementById("msg").innerText="Unable to reach server. Please try again in a moment.";
}

}

async function signup(){

const name = document.getElementById("signupName").value;
const email = document.getElementById("signupEmail").value;
const password = document.getElementById("signupPassword").value;

try{
const res = await fetch(`${API_URL}/signup`,{
method:"POST",
credentials:"include",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({name,email,password})
});

const data = await res.json();

if(data.success){
localStorage.setItem("user",JSON.stringify(data.user));
window.location.href=getNextPath();
}else{
document.getElementById("msg").innerText=data.message || "Signup failed";
}
}catch(error){
document.getElementById("msg").innerText="Unable to reach server. Please try again in a moment.";
}

}

</script>

</body>
</html>
