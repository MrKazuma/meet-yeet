<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet & Yeet</title>
<link rel="icon" type="image/png" href="/icons/logo.png">
<link rel="stylesheet" href="/styles.css">

<style>

body{
background:
  radial-gradient(55% 45% at 12% 0%, rgba(255,122,0,0.14), transparent 60%),
  radial-gradient(45% 40% at 92% 15%, rgba(47,155,255,0.12), transparent 60%),
  var(--bg);
}

/* NAVBAR */

#navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
position: sticky;
top: 0;
z-index: 20;
background: rgba(11,11,20,0.75);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
border-bottom: 1px solid var(--border);
}

#logo img{
height:30px;
}

#navActions{
display:flex;
align-items:center;
gap:15px;
}

#profileContainer{
display:none;
align-items:center;
gap:8px;
background:var(--surface-alt);
padding:8px 16px;
border-radius:var(--radius-pill);
border: 1px solid var(--border);
}

#profileName{
color:var(--text);
font-weight:600;
font-size:14px;
}

/* HERO */

#hero{
padding: 90px 20px 60px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

#hero h1{
font-size:52px;
font-weight:800;
letter-spacing:-0.02em;
margin:0 0 14px;
max-width: 700px;
}

#hero p{
color:var(--text-muted);
font-size:18px;
margin:0 0 34px;
}

#hero p b{
color:var(--text);
font-weight:600;
}

#heroActions{
display:flex;
gap:14px;
flex-wrap:wrap;
justify-content:center;
}

/* JOIN BOX */

#joinBox{
margin-top:40px;
display:flex;
gap:8px;
}

#joinInput{
width:240px;
}

#upcoming{
margin-top:40px;
padding:22px;
width:460px;
max-width:92vw;
text-align:left;
}

#upcoming h3{
margin:0 0 14px;
font-size:16px;
font-weight:700;
color:var(--text);
display:flex;
align-items:center;
gap:8px;
}

#upcomingList{
margin:0;
padding:0;
list-style:none;
display:flex;
flex-direction:column;
gap:10px;
}

#upcomingList li{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:10px 12px;
background:var(--surface-alt);
border:1px solid var(--border);
border-radius:var(--radius-md);
color:var(--text-muted);
font-size:14px;
}

#upcomingList li a{
font-weight:600;
color:var(--accent);
text-decoration:none;
}

#upcomingList li a:hover{
color:var(--accent-hover);
text-decoration:underline;
}

/* RESPONSIVE */
@media (max-width: 480px) {
  #logo .logo-text {
    display: none;
  }
}

@media (max-width: 600px) {
  #navbar {
    padding: 14px 18px;
  }
  #hero {
    padding: 56px 16px 40px;
  }
  #hero h1 {
    font-size: 34px;
  }
  #hero p {
    font-size: 16px;
  }
  #heroActions {
    width: 100%;
  }
  #heroActions .btn {
    flex: 1 1 auto;
  }
  #joinBox {
    width: 100%;
  }
  #joinInput {
    flex: 1;
    width: auto;
  }
}

</style>
</head>

<body>

<div id="navbar">

<div id="logo" class="brand-mark">
<img src="/icons/logo.png" alt="Meet & Yeet logo">
<span class="logo-text">Meet &amp; Yeet</span>
</div>

<div id="navActions">
<div id="profileContainer">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand)">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </svg>
  <span id="profileName"></span>
</div>
<button id="loginBtn" class="btn btn-ghost" onclick="handleAuthButton()">
Login
</button>
</div>

</div>

<div id="hero">

<h1>Video meetings made simple</h1>

<p><b>Start or join meetings instantly with Meet &amp; Yeet © 2026.</b><br>"Click. Meet. Yeet."</p>

<div id="heroActions">
<button id="startBtn" class="btn btn-primary" onclick="createMeeting()">
Start meeting
</button>

<button id="scheduleBtn" class="btn btn-secondary" onclick="goToSchedule()">
Schedule meeting
</button>
</div>

<div id="joinBox">

<input id="joinInput" class="input" placeholder="Enter meeting ID" autocomplete="off">

<button id="joinBtn" class="btn btn-ghost" onclick="joinMeeting()">
Join
</button>

</div>

<div id="upcoming" class="card">
<h3>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand)"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
  Upcoming meetings
</h3>
<ul id="upcomingList">
<li>Loading scheduled meetings...</li>
</ul>
</div>

</div>

<script>
const API_URL = (() => {
const host = window.location.hostname;
if(host === "localhost" || host === "127.0.0.1"){
return "";
}
return "/api";
})();


let isLoggedIn = false;

async function syncAuthState(){
const loginBtn = document.getElementById("loginBtn");
const profileName = document.getElementById("profileName");
const profileContainer = document.getElementById("profileContainer");

try{
const res = await fetch(`${API_URL}/me`, { credentials: "include" });
const data = await res.json();

isLoggedIn = Boolean(res.ok && data.success);
if (isLoggedIn && data.user) {
    profileName.textContent = data.user.name || data.user.email;
    profileContainer.style.display = "flex";
} else {
    profileContainer.style.display = "none";
}
}catch(error){
isLoggedIn = false;
profileContainer.style.display = "none";
}

loginBtn.textContent = isLoggedIn ? "Logout" : "Login";
}

function handleAuthButton(){
if(isLoggedIn){
logout();
return;
}

const nextPath = encodeURIComponent(window.location.pathname || "/");
window.location = "/login?next=" + nextPath;
}

function goToSchedule(){
window.location = "/schedule";
}

async function logout(){
try{
await fetch(`${API_URL}/logout`, {
method: "POST",
credentials: "include"
});
}catch(error){
}

isLoggedIn = false;
document.getElementById("loginBtn").textContent = "Login";
document.getElementById("profileContainer").style.display = "none";
window.location = "/";
}

function joinMeeting(){

const id=document.getElementById("joinInput").value;

if(id){
window.location="/room/"+id;
}

}

document.getElementById("joinInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        joinMeeting();
    }
});

async function loadScheduledMeetings(){

const list=document.getElementById("upcomingList");

try{
const res=await fetch(`${API_URL}/scheduled-meetings`, { credentials: "include" });
const data=await res.json();

if(!data.success || !data.meetings.length){
list.innerHTML="<li>No meetings scheduled yet.</li>";
return;
}

list.innerHTML="";

data.meetings.slice(0,5).forEach(meeting=>{
const li=document.createElement("li");
const when=new Date(meeting.time).toLocaleString();
li.innerHTML=`<span>${meeting.title} &middot; ${when}</span><a href="${meeting.link}">Join</a>`;
list.appendChild(li);
});

}catch(error){
list.innerHTML="<li>Unable to load scheduled meetings.</li>";
}

}

loadScheduledMeetings();

async function createMeeting(){

if(!isLoggedIn){
const nextPath = encodeURIComponent(window.location.pathname || "/");
window.location = "/login?next=" + nextPath;
return;
}

try{
const res = await fetch(`${API_URL}/create-meeting`,{
method:"POST",
credentials:"include"
});

const data = await res.json();

if(res.status === 401){
const nextPath = encodeURIComponent(window.location.pathname || "/");
window.location = "/login?next=" + nextPath;
return;
}

if(!res.ok || !data.link){
alert("Unable to create meeting right now");
return;
}

window.location = data.link;
}catch(error){
alert("Unable to create meeting right now");
}

}

syncAuthState();

</script>

</body>
</html>
